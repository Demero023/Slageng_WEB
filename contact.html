<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slageng-contact-page</title>
    <link rel="stylesheet" href="Style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="home.html">
          <img src="content/logo.png" alt="Slageng Logo" class="logo" />
        </a>
        <a class="nav-link" href="events.html">Events</a>
        <a class="nav-link" href="contact.html">Contact</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link" href="Community.html">Community</a>
      </nav>
    </header>

    <section class="content-box">
      <h1>Book a Table</h1>
      <!-- Booking table-->
      <button class="book-table" id="bookNowBtn">Book now</button>
    </section>
    <!-- modal for the from-->
    <div id="bookingModal" class="modal"> <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>📅 Book a VIP Table</h2>
            <form id="bookingForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Your full name" required />

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="076 527 1293" required />

                <label for="date">Date</label>
                <input type="date" id="date" required />

                <label for="guests">Number of Guests</label>
                <input type="number" id="guests" placeholder="How many people?" required />

                <label for="message">Special Requests</label>
                <textarea id="message" placeholder="Any special requests?"></textarea>

                <button type="submit" class="btn-submit">Submit Booking</button>
            </form>
        </div>
    </div>

    <!-- JavaScript link -->
    <script src="script.js"></script>
</body>
</html>


  </body>
