    <link rel="stylesheet" href="Style.css" />
    <link
      rel="stylesheet"

    />

  <body>
    <header class="header">
      <nav>
        <a href="index.html">
          <img
            src="https://slageng.co.za/content/logo.png"

            class="logo"
          />

        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="nav-links" id="navLinks">
          <a class="nav-link fade-in" href="events.html">Events</a>
          <a class="nav-link fade-in" href="contact.html">Contact</a>
          <a class="nav-link fade-in" href="about.html">About</a>
          <a class="nav-link fade-in" href="Community.html">Community</a>
        </div>
      </nav>
    </header>

    <section class="content-box fade-in">
      <h1>Book a Table</h1>
      <!-- Booking table-->
      <button class="book-table fade-in" id="bookNowBtn">Book now</button>
    </section>

    <section class="content-box fade-in">
      <p class="fade-in">Chat on Whatsapp</p>
      <img
        src="https://i.postimg.cc/VvHV1gSd/whatapp.png"
        alt="Whatsapp"
        class="contact-images fade-in"
      />
      <br />
      <a href="https://wa.me/+27765271293" target="_blank">
        <i class="fab fa-whatsapp fade-in"></i>
      </a>
    </section>
    <section class="content-box fade-in">
      <p class="fade-in">Our instagram page</p>
      <img
        src="https://i.postimg.cc/wBmykj5W/instagram.png"
        alt="Instagram"
        class="contact-images fade-in"
      />
      <br />
      <a href="https://www.instagram.com/slageng_/" target="_blank">
        <i class="fab fa-instagram fade-in"></i>
      </a>
    </section>

    <section class="content-box fade-in">
      <p class="fade-in">Our Facebook Page</p>
      <img
        src="https://i.postimg.cc/bwGszwBB/facebook.png"
        alt="Facebook"
        class="contact-images fade-in"
      />
      <br />
      <a
        href="https://www.facebook.com/profile.php?id=100083221124335"
        target="_blank"
      >
        <i class="fab fa-facebook fade-in"></i>
      </a>
    </section>

    <!-- modal for the from-->
    <div id="bookingModal" class="modal fade-in">
      <div class="modal-content fade-in">
        <span class="close-btn fade-in">&times;</span>
        <h2 class="fade-in">📅 Book a VIP Table</h2>
        <form
          id="bookingForm"
          action="https://script.google.com/macros/s/AKfycbyUDYTc-m2Uk4F_37u6z7B12f0eVsj2wyupYfBfRAqA75eHYSVDZyqSCoSaYV-fMbMVXg/exec"
          method="POST"
          class="fade-in"
        >
          <label for="name" class="fade-in">Full Name</label>
          <input
            type="text"
            id="name"
            class="fade-in"
            placeholder="Your full name"
            required
          />

          <label for="phone" class="fade-in">Phone Number</label>
          <input
            type="tel"
            id="phone"
            class="fade-in"
            placeholder="076 527 1293"
            required
          />

          <label for="date" class="fade-in">Date</label>
          <input type="date" id="date" class="fade-in" required />

          <label for="guests" class="fade-in">Number of Guests</label>
          <input
            type="number"
            id="guests"
            class="fade-in"
            placeholder="How many people?"
            required
          />

          <label for="message" class="fade-in"
            >Special Requests e.g(VIP Table?)</label
          >
          <textarea
            id="message"
            class="fade-in"
            placeholder="Any special requests?"
          ></textarea>

          <button type="submit" class="btn-submit fade-in">
            Submit Booking
          </button>
        </form>
      </div>
    </div>

    <footer class="footer fade-in">
      <!-- table of 3 colums -->
      <table class="footer-table fade-in">
        <tr>
          <th>Slageng EST 2006</th>
          <th>Quick Links</th>
          <th>Social Media</th>
        </tr>
        <tr>
          <td>
            <a href="index.html">
              <img
                src="content/logo.png"
                alt="Slageng Logo"
                class="footer-logo fade-in"
              />
            </a>
          </td>
          <td><a href="index.html">Home</a></td>
          <td>
            <a href="https://www.instagram.com/slageng_/" target="_blank">
              <i class="fab fa-instagram fade-in"></i>
            </a>

            <a
              href="https://www.facebook.com/profile.php?id=100083221124335"
              target="_blank"
            >
              <i class="fab fa-facebook fade-in"></i>
            </a>
          </td>
        </tr>
        <tr>
          <td>127 Chris Hani Drive, Seshego Zone 1 Complex</td>
          <td><a href="events.html">Events</a></td>
          <!-- whatsApp-->
          <td>
            <a href="https://wa.me/+27765271293" target="_blank">
              <i class="fab fa-whatsapp fade-in"></i>
            </a>
          </td>
        </tr>
        <tr>
          <td>© 2026 Slageng. All rights reserved.</td>
          <td><a href="contact.html">Contact Us</a></td>
          <td></td>
        </tr>
        <tr>
          <td></td>

          <td></td>
        </tr>
        <tr>
          <td></td>
          <td><a href="Community.html">Our Community</a></td>
          <td></td>
        </tr>
      </table>
    </footer>
    <!-- JavaScript link -->
    <script src="script.js"></script>

</html>
