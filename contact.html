    <section class="content-box">
      <h1>Book a Table</h1>
      <!-- Booking table-->
      <button class="book-table" id="bookNowBtn">Book now</button>
    </section>

    <section class="content-box">
      <p>Chat on Whatsapp</p>
      <a href="https://wa.me/27765271293" target="_blank">
        <i class="fab fa-whatsapp"></i>
      </a>
    </section>
    <section class="content-box">
      <p>Our instagram page</p>
      <a href="https://instagram.com/yourpage" target="_blank">
        <i class="fab fa-instagram"></i>
      </a>
    </section>

    <section class="content-box">
      <p>Our Facebook Page</p>
      <a href="https://facebook.com/yourpage" target="_blank">
        <i class="fab fa-facebook"></i>
      </a>
    </section>

    <!-- modal for the from-->
    <div id="bookingModal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>📅 Book a VIP Table</h2>
        <form
          id="bookingForm"
          action="https://script.google.com/macros/s/AKfycbyUDYTc-m2Uk4F_37u6z7B12f0eVsj2wyupYfBfRAqA75eHYSVDZyqSCoSaYV-fMbMVXg/exec"
          method="POST"
        >
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Your full name" required />

          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="076 527 1293" required />

          <label for="date">Date</label>
          <input type="date" id="date" required />

          <label for="guests">Number of Guests</label>
          <input
            type="number"
            id="guests"
            placeholder="How many people?"
            required
          />

          <label for="message">Special Requests e.g(VIP Table?)</label>
          <textarea id="message" placeholder="Any special requests?"></textarea>

          <button type="submit" class="btn-submit">Submit Booking</button>
        </form>
      </div>
    </div>

    <footer class="footer">
      <!-- table of 3 colums -->
      <table class="footer-table">

        <tr>

          <td>
