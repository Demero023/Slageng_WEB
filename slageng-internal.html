<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slageng Dashboard</title>
    <link rel="stylesheet" href="Style.css" />
    <link rel="icon" type="image/png" href="content/favicon.png" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">
          <img src="content/logo.png" alt="Slageng Logo" class="logo" />
        </a>
        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="nav-links" id="navLinks">
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link" href="index.html">Home</a>
        </div>
      </nav>
    </header>

    <section class="content-box">
      <h1>📋 Bookings Dashboard</h1>

      <!-- Bookings table (always visible) -->
      <div
        id="bookingTableSection"
        style="overflow-x: auto; -webkit-overflow-scrolling: touch"
      >
        <table
          id="bookingTable"
          style="
            width: 100%;
            max-width: 100%;
            border-collapse: collapse;
            background-color: #1a1a1a;
            color: white;
            border-radius: 10px;
            overflow: hidden;
          "
        >
          <thead>
            <tr style="background-color: #fa4a0c">
              <th style="padding: 10px">Timestamp</th>
              <th style="padding: 10px">Name</th>
              <th style="padding: 10px">Phone</th>
              <th style="padding: 10px">Date</th>
              <th style="padding: 10px">Guests</th>
              <th style="padding: 10px">Message</th>
            </tr>
          </thead>
          <tbody id="bookingTableBody">
            <tr>
              <td colspan="6" style="text-align: center; padding: 20px">
                Loading bookings...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer class="footer">
      <p>Slageng EST 2006 © All rights reserved.</p>
    </footer>

    <script>
      // Web App URL (Google Apps Script that returns data)
      const webAppUrl =
        "https://script.google.com/macros/s/AKfycbxxA-TvgRhQYf1j4TLzHbHE5Az-58YXFiLibH_viDuFMb8EXpFv1reJmeSQKJRf8-aIDg/exec";

      function fetchBookings() {
        fetch(webAppUrl)
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Network response was not ok");
            }
            return response.json();
          })
          .then(function (data) {
            var tableBody = document.getElementById("bookingTableBody");
            tableBody.innerHTML = "";

            if (data.length === 0) {
              tableBody.innerHTML =
                '<tr><td colspan="6" style="text-align:center;">No bookings yet.</td></tr>';
              return;
            }

            for (var i = 0; i < data.length; i++) {
              var row =
                "<tr>" +
                '<td style="padding:10px;">' +
                new Date(data[i].timestamp).toLocaleString() +
                "</td>" +
                '<td style="padding:10px;">' +
                data[i].name +
                "</td>" +
                '<td style="padding:10px;">' +
                data[i].phone +
                "</td>" +
                '<td style="padding:10px;">' +
                new Date(data[i].date).toLocaleDateString() +
                "</td>" +
                '<td style="padding:10px;">' +
                data[i].guests +
                "</td>" +
                '<td style="padding:10px;">' +
                data[i].message +
                "</td>" +
                "</tr>";
              tableBody.innerHTML += row;
            }
          })
          .catch(function (error) {
            console.error("Error:", error);
            document.getElementById("bookingTableBody").innerHTML =
              '<tr><td colspan="6" style="text-align:center;">❌ Failed to load bookings.</td></tr>';
          });
      }

      // Load bookings immediately
      fetchBookings();
    </script>
    <script src="script.js"></script>
  </body>
</html>
