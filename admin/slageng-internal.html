<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slageng Dashboard</title>
    <link rel="stylesheet" href="/Style.css" />
    <link rel="icon" type="image/png" href="/content/favicon.png" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <header class="header">
      <nav>
        <a href="/index.html">
          <img
            src="/content/6b38cfb61dfa8d1694519cc2e3b487ab.png"
            alt="Slageng Logo"
            class="logo"
          />
        </a>
        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </nav>
    </header>

    <section class="content-box">
      <h1>Bookings Dashboard</h1>

      <!-- Bookings table (always visible) -->
      <div
        id="bookingTableSection"
        style="overflow-x: auto; -webkit-overflow-scrolling: touch"
      >
        <table
          id="bookingTable"
          style="
            width: 100%;
            max-width: 100%;
            border-collapse: collapse;
            background-color: #1a1a1a;
            color: white;
            border-radius: 10px;
            overflow: hidden;
          "
        >
          <thead>
            <tr style="background-color: #fa4a0c">
              <th style="padding: 10px">Timestamp</th>
              <th style="padding: 10px">Reference</th>
              <th style="padding: 10px">Name</th>
              <th style="padding: 10px">Phone</th>
              <th style="padding: 10px">Date</th>
              <th style="padding: 10px">Guests</th>
              <th style="padding: 10px">Request</th>

              <th style="padding: 10px">Action</th>
            </tr>
          </thead>
          <tbody id="bookingTableBody">
            <tr>
              <td colspan="6" style="text-align: center; padding: 20px">
                Loading bookings...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer class="footer">
      <p>Slageng EST 2006 © All rights reserved.</p>
    </footer>

    <script>
      // Web App URL (Google Apps Script that returns data)
      const webAppUrl =
        "https://script.google.com/macros/s/AKfycbxzmmtEjMobeR_WgEf7JqtmfiRRrmBu_08lHLGtuONRKeJvBG1_NNPZ9JsFO6ToHK0jNg/exec";

      function fetchBookings() {
        fetch(webAppUrl)
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Network response was not ok");
            }
            return response.json();
          })
          .then(function (data) {
            var tableBody = document.getElementById("bookingTableBody");
            tableBody.innerHTML = "";

            if (data.length === 0) {
              tableBody.innerHTML =
                '<tr><td colspan="6" style="text-align:center;">No bookings yet.</td></tr>';
              return;
            }

            for (var i = 0; i < data.length; i++) {
              <!--Whatsapp message build-->

              var phone = data[i].phone;
              var name = data[i].name;
              var date = new Date(data[i].date).toLocaleDateString();
              var guests = data[i].guests;
              var message = data[i].message;
              var reference = data[i].Reference_Number;

              var whatsappMessage =
                "Hi " +
                name +
                ", thank you for your booking request using https://slageng.co.za \n\n" +
                "Reference: " +
                reference +
                "\n" +
                "Date: " +
                date +
                "\n" +
                "Guests: " +
                guests +
                "\n" +
                "Requests: " +
                message +
                "\n\n" +
                "Availability is subject to confirmation. We'll be in touch within 2 hours.\n\n" +
                "Slageng | +27 81 474 8756";

              var whatsappLink =
                "https://wa.me/" +
                phone +
                "?text=" +
                encodeURIComponent(whatsappMessage);

              var row =
                "<tr>" +
                '<td style="padding:10px;">' +
                new Date(data[i].timestamp).toLocaleString() +
                "</td>" +
                '<td style="padding:10px;">' +
                reference +
                "</td>" +
                '<td style="padding:10px;">' +
                name +
                "</td>" +
                '<td style="padding:10px;">' +
                phone +
                "</td>" +
                '<td style="padding:10px;">' +
                new Date(data[i].date).toLocaleDateString() +
                "</td>" +
                '<td style="padding:10px;">' +
                guests +
                "</td>" +
                '<td style="padding:10px;">' +
                message +
                "</td>" +
                '<td style="padding:10px;"><a href="' +
                whatsappLink +
                '" target="_blank" class="whatsapp-btn">Confirm</a></td>' +
                +"</tr>";
              tableBody.innerHTML += row;
            }
          })
          .catch(function (error) {
            console.error("Error:", error);
            document.getElementById("bookingTableBody").innerHTML =
              '<tr><td colspan="6" style="text-align:center;"> Failed to load bookings. Please refresh the page</td></tr>';
          });
      }

      // Load bookings immediately
      fetchBookings();
    </script>
    <script src="script.js"></script>
  </body>
</html>
